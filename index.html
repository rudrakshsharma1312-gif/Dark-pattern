<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DarkGuard AI — Auditor for Deceptive E-Commerce Design</title>
    <meta name="description" content="Hybrid ML and rule-based auditor detecting fake urgency, misleading discounts, confirm shaming, and pre-selected extras with reversible Ethical View." />
    <meta property="og:title" content="DarkGuard AI — Auditor for Deceptive E-Commerce Design" />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('darkguard-theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-canvas)] text-[var(--ink-700)] antialiased selection:bg-[var(--accent-soft)] selection:text-[var(--ink-900)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
