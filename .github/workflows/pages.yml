name: Deploy GitHub Pages

on:
  # Deploys only on pushes to main branch (or manual workflow_dispatch)
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Package Extension
        run: npm run package:extension

      - name: Verify Extension Parity
        run: npm run verify:extension

      - name: Build Web Application
        run: npm run build:web

      - name: Setup Pages Configuration
        uses: actions/configure-pages@v5

      - name: Assemble Public Pages Artifact
        run: |
          mkdir -p _site/test-site _site/landing _site/app _site/downloads _site/app/downloads
          # Landing page at root and at /landing/
          cp -r landing/* _site/
          cp -r landing/* _site/landing/
          # React Web App at /app/
          cp -r dist-web/* _site/app/
          # Test site at /test-site/
          cp -r test-site/* _site/test-site/
          # Published extension zip & build info at /downloads/ and /app/downloads/
          cp downloads/darkguard-extension.zip _site/downloads/darkguard-extension.zip
          cp downloads/darkguard-extension.zip _site/app/downloads/darkguard-extension.zip
          ZIP_SHA=$(sha256sum downloads/darkguard-extension.zip | awk '{print $1}')
          echo "Commit: ${{ github.sha }}" > _site/downloads/build-info.txt
          echo "Build-Date: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> _site/downloads/build-info.txt
          echo "ZIP-SHA256: ${ZIP_SHA}" >> _site/downloads/build-info.txt
          cp _site/downloads/build-info.txt _site/app/downloads/build-info.txt

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
