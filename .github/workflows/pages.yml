name: Deploy GitHub Pages

on:
  # Deploys only on pushes to main branch (or manual workflow_dispatch)
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build:web

      - name: Setup Pages Configuration
        uses: actions/configure-pages@v5

      - name: Assemble Public Pages Artifact
        run: |
          mkdir -p _site/test-site _site/landing _site/app
          # Landing page at root and at /landing/
          cp -r landing/* _site/
          cp -r landing/* _site/landing/
          # React Web App at /app/
          cp -r dist-web/* _site/app/
          # Test site at /test-site/
          cp -r test-site/* _site/test-site/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
