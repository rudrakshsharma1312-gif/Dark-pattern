<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clean Remember Me Checkbox - Real World Pattern</title>
  <style>
    body { font-family: sans-serif; padding: 24px; }
    .login-card { max-width: 360px; margin: 0 auto; border: 1px solid #e5e7eb; padding: 24px; border-radius: 8px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .form-group input[type="text"], .form-group input[type="password"] { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .btn-submit { width: 100%; background: #2563eb; color: white; padding: 10px; border: none; border-radius: 4px; font-weight: 500; cursor: pointer; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>Sign In to Your Account</h2>
    <form>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="text" id="email" name="email" value="customer@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" value="••••••••">
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="remember" name="remember" checked>
        <label for="remember">Remember me on this computer</label>
      </div>
      <button type="submit" class="btn-submit">Sign In</button>
    </form>
  </div>
</body>
</html>
