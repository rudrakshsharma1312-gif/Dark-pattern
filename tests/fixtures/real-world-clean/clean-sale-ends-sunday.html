<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clean Sale Ends Sunday - Real World Pattern</title>
  <style>
    body { font-family: sans-serif; padding: 24px; }
    .hero-banner { background: #fdf2f8; border: 1px solid #fbcfe8; padding: 20px; border-radius: 8px; text-align: center; }
    .hero-banner h2 { margin-top: 0; color: #9d174d; }
    .banner-text { font-size: 16px; color: #4b5563; }
    .btn-shop { background: #be185d; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="hero-banner">
    <h2>Weekend Seasonal Event</h2>
    <p class="banner-text">Enjoy 20% off all outerwear collections. Sale ends Sunday at midnight.</p>
    <button class="btn-shop">Explore Collection</button>
  </div>
</body>
</html>
