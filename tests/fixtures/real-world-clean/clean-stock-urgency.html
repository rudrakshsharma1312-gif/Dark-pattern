<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clean Stock Urgency - Real World Pattern</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .product-card { max-width: 400px; border: 1px solid #ddd; padding: 16px; border-radius: 8px; }
    .price { font-size: 24px; font-weight: bold; color: #111; }
    .stock-status { color: #b12704; font-size: 14px; margin: 8px 0; display: block; }
    .btn-primary { background: #ffd814; border: 1px solid #fcd200; border-radius: 20px; padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="product-card">
    <h2>Wireless Noise-Canceling Headphones</h2>
    <div class="price">$199.99</div>
    <span class="stock-status">Only 3 left in stock - order soon.</span>
    <p>Ships from and sold by AudioDirect.</p>
    <button class="btn-primary">Add to Cart</button>
  </div>
</body>
</html>
