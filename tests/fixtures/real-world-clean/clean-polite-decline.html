<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clean Polite Decline - Real World Pattern</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .promo-dialog { max-width: 400px; border: 1px solid #ddd; padding: 24px; border-radius: 8px; text-align: center; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .btn-claim { background: #3b82f6; color: white; padding: 10px 16px; border-radius: 6px; border: none; font-size: 16px; cursor: pointer; }
    .btn-decline { background: #f3f4f6; color: #374151; padding: 8px 16px; border-radius: 6px; border: 1px solid #d1d5db; cursor: pointer; }
    .link-decline { color: #6b7280; font-size: 14px; text-decoration: underline; margin-top: 8px; display: inline-block; }
  </style>
</head>
<body>
  <div class="promo-dialog">
    <h2>Special First-Order Offer</h2>
    <p>Get 10% off your order today when you sign up for member perks.</p>
    <div class="actions">
      <button class="btn-claim">Claim 10% Discount</button>
      <button class="btn-decline">No thanks</button>
      <button class="btn-decline">Maybe later</button>
      <a href="/cart" class="link-decline">Decline and return to cart</a>
    </div>
  </div>
</body>
</html>
