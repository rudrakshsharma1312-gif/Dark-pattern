<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clean Free Shipping Banner - Real World Pattern</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; }
    .announcement-bar { background: #2563eb; color: white; text-align: center; padding: 10px; font-weight: 500; font-size: 14px; }
    .container { max-width: 600px; margin: 20px auto; padding: 0 16px; }
    .product-title { font-size: 20px; font-weight: bold; }
    .price { font-size: 18px; color: #333; margin: 8px 0; }
    .btn-buy { background: #111827; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="announcement-bar">
    Free shipping on all orders over $50! Automatic discount applied at checkout.
  </div>
  <div class="container">
    <h1 class="product-title">Everyday Cotton T-Shirt</h1>
    <div class="price">$28.00</div>
    <p>Premium lightweight combed cotton jersey tee.</p>
    <button class="btn-buy">Add to Bag</button>
  </div>
</body>
</html>
